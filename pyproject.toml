[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "allianz-claims-rag-agent"
version = "0.1.0"
description = "Local agentic RAG assistant for the CIDE, ASCIDE and CICOS manual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langgraph>=1.2,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pypdf>=6.7,<7",
    "qdrant-client>=1.15,<2",
]

[project.scripts]
allianz-ingest = "allianz_claims_rag_agent.ingestion.cli:main"
allianz-index = "allianz_claims_rag_agent.retrieval.cli:index_main"
allianz-search = "allianz_claims_rag_agent.retrieval.cli:search_main"
allianz-evaluate-retrieval = "allianz_claims_rag_agent.evaluation.cli:main"
allianz-evaluate-demo = "allianz_claims_rag_agent.evaluation.demo:main"
allianz-evaluate-llms = "allianz_claims_rag_agent.evaluation.llm_benchmark:main"
allianz-generate = "allianz_claims_rag_agent.generation.cli:main"
allianz-agent = "allianz_claims_rag_agent.orchestration.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]
rerank = [
    "sentence-transformers>=5.1,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
